name: Ingestion fixes validation
on:
  push:
    branches: [codex/ingestion-fixes-validation-20260911]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: validation-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 7b750d14692b16114d36f97a2c8e04a950751689
          path: repository
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact integration corrections
        working-directory: repository
        run: python ../validation-tools/.github/ingestion-validation/correct.py
      - name: Format and lint
        working-directory: repository
        run: |
          python -m pip install -q ruff==0.16.0
          python -m ruff format parsedmarc/output_storage.py tests/test_init.py
          python -m ruff check .
          python -m ruff format --check .
      - name: Publish isolated corrected candidate
        id: commit
        working-directory: repository
        run: |
          test "$(git rev-parse HEAD)" = 7b750d14692b16114d36f97a2c8e04a950751689
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add parsedmarc/output_storage.py tests/test_init.py docs/source/usage.md
          git commit -m 'fix: resolve ingestion integration typing and preserve non-array history' -m 'Use the underlying temporary file with its actual IO[str] type, explicitly type parsing results, narrow MIME sample payloads, and assert that unexpected JSON roots are preserved. Document storage recovery, retry and rotation semantics. No production behavior is relaxed to satisfy a test.'
          branch="codex/ingestion-candidate-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_BRANCH=$branch"
          echo "CANDIDATE_SHA=$sha"
          echo "Candidate: \`$branch\` at \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
  tests:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qqy install libemail-outlook-message-perl > /tmp/apt-install.log
          if [ '${{ matrix.python }}' = 3.13 ]; then
            python -m pip install -q -e '.[build,all,postgresql]'
          else
            python -m pip install -q -e '.[build,all]'
          fi
      - name: Ruff checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Pyright
        if: matrix.python == '3.13'
        run: python -m pyright
      - name: Complete repository test suite
        run: python -m pytest --tb=short --disable-warnings -q tests/
      - name: Distribution and documentation builds
        if: matrix.python == '3.13'
        run: |
          python -m hatch build
          python -m sphinx -q -b html docs/source "$RUNNER_TEMP/parsedmarc-docs"
  live-search:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: validation-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: repository
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Start disposable local search services
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run --rm -d --name ingestion-elastic -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e ES_JAVA_OPTS='-Xms512m -Xmx512m' docker.elastic.co/elasticsearch/elasticsearch:8.19.7
          docker run --rm -d --name ingestion-opensearch -p 127.0.0.1:9201:9200 -e discovery.type=single-node -e DISABLE_INSTALL_DEMO_CONFIG=true -e DISABLE_SECURITY_PLUGIN=true -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' opensearchproject/opensearch:2.19.0
          for port in 9200 9201; do
            ready=false
            for attempt in $(seq 1 90); do
              if curl -fs "http://127.0.0.1:$port/_cluster/health" > /tmp/health.json; then ready=true; break; fi
              sleep 2
            done
            $ready || exit 1
          done
      - name: Install runtime integrations
        working-directory: repository
        run: python -m pip install -q -e '.[elastic,opensearch]'
      - name: Live partial-save, lost-acknowledgment, legacy-row and timezone checks
        working-directory: repository
        run: python ../validation-tools/.github/ingestion-validation/live_search.py
      - name: Remove disposable services
        if: always()
        run: docker rm -f ingestion-elastic ingestion-opensearch || true
