name: Cybaa Release

on:
  push:
    tags:
      - '*\+cybaa.*'

permissions:
  contents: read

concurrency:
  group: cybaa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.repository == 'milkyjoe90/parsedmarc'
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit

  build:
    name: Build Cybaa distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify version and build distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade hatch
          version="$(hatch version)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version ($version)" >&2
            exit 1
          fi
          hatch build

      - name: Prepare checksums and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          awk -v ver="$GITHUB_REF_NAME" '
            $0 == "## " ver {found=1; next}
            /^## / && found {exit}
            found {print}
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if ! [ -s dist/RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: cybaa-dist
          path: dist/
          if-no-files-found: error

      - name: Upload installed-package smoke check
        uses: actions/upload-artifact@v7
        with:
          name: cybaa-smoke
          path: scripts/cybaa-release-smoke.py
          if-no-files-found: error

  smoke:
    name: Installed ${{ matrix.artifact }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        artifact: [wheel, sdist]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: cybaa-dist
          path: dist/

      - name: Download installed-package smoke check
        uses: actions/download-artifact@v8
        with:
          name: cybaa-smoke
          path: smoke/

      - name: Verify distributions and install outside the checkout
        env:
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          python -m venv "$RUNNER_TEMP/cybaa-release-venv"
          if [ "$ARTIFACT_KIND" = wheel ]; then
            "$RUNNER_TEMP/cybaa-release-venv/bin/python" -m pip install dist/*.whl
          else
            "$RUNNER_TEMP/cybaa-release-venv/bin/python" -m pip install dist/*.tar.gz
          fi
          "$RUNNER_TEMP/cybaa-release-venv/bin/python" -m pip check
          cp smoke/cybaa-release-smoke.py "$RUNNER_TEMP/cybaa-release-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cybaa-release-venv/bin/python" -I cybaa-release-smoke.py "$GITHUB_REF_NAME"

  github-release:
    name: Publish Cybaa GitHub release
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: cybaa-dist
          path: dist/

      - name: Verify distribution checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
